services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI AI Service
  # ----------------------------------------------------------------------------
  - type: web
    name: hackforge-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Node.js Express Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: hackforge-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: hackforge-ai-service
          property: host
      - key: CORS_ORIGIN
        value: "*"

  # ----------------------------------------------------------------------------
  # 3. React Vite Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: hackforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: hackforge-backend
          property: host
