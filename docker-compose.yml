version: "3.9"

# ── Shared network so services can reach each other by name ───────────────────
networks:
  hackforge:
    driver: bridge

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: hackforge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hackforge
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Service (Python / FastAPI) ────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: hackforge-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - LOG_LEVEL=info
    volumes:
      - ./ai-service:/app          # hot-reload in dev
    networks:
      - hackforge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js / Express) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackforge-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/hackforge
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=development
    volumes:
      - ./backend:/app             # hot-reload via nodemon
      - /app/node_modules          # preserve container node_modules
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - hackforge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (React / Vite) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackforge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app            # hot-reload via Vite HMR
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - hackforge

volumes:
  mongo_data:
